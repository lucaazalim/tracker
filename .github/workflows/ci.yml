name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: TrackerKit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        run: swift test --package-path Packages/TrackerKit

  build:
    name: Build app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Tracker.xcodeproj \
            -scheme Tracker \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
